name: MixedMines
version: 2.0.0
main: br.com.mixedmines.MixedMinesPlugin
author: Hognose
description: Advanced multi-version mines system for Bukkit-compatible servers

# api-version is intentionally omitted: this descriptor must also load on 1.8.8.
# Modern-only integrations are detected at runtime and remain optional.
softdepend:
  - WorldEdit
  - FastAsyncWorldEdit
  - WorldGuard
  - PlaceholderAPI
  - DecentHolograms
  - HolographicDisplays
  - Vault

commands:
  mixedmines:
    description: Main MixedMines command
    usage: /mixedmines
    aliases: [mina, mine]

permissions:
  mixedmines.admin:
    default: op
  mixedmines.use:
    default: true
  mixedmines.reload:
    default: op
  mixedmines.bypass:
    default: op
